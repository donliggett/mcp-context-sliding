# Streamable HTTP deployment.
#
# stdio servers are launched by the MCP client itself, so compose is only
# useful for the HTTP transport — see the README for the LM Studio stdio setup.
#
#   docker compose up -d
#   curl http://127.0.0.1:3001/health

services:
  context-window:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-context-window:latest
    container_name: mcp-context-window

    command: ["--http"]

    environment:
      CTX_TRANSPORT: http
      CTX_HTTP_HOST: 0.0.0.0
      CTX_HTTP_PORT: 3001
      CTX_DATA_DIR: /data
      # The LLM runs on the host, not in this container.
      CTX_LLM_BASE_URL: http://host.docker.internal:1234/v1
      CTX_BUDGET: "4000"
      CTX_CHUNK_TOKENS: "800"
      CTX_AUDIT: "true"
      # Uncomment to let doc_ingest read files from a mounted directory:
      # CTX_INGEST_ROOTS: /ingest

    ports:
      # Loopback only. This server has no authentication.
      - "127.0.0.1:3001:3001"

    volumes:
      # Named volume so sessions and documents survive container replacement.
      - context-data:/data
      # Optional read-only source directory for doc_ingest:
      # - ./sources:/ingest:ro

    extra_hosts:
      # Required on Linux; a no-op on Docker Desktop, which already provides it.
      - "host.docker.internal:host-gateway"

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"
    init: true

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  context-data:
